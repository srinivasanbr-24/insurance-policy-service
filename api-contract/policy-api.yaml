openapi: 3.0.3

info:
  title: Insurance Policy Management API
  version: 1.0.0
  description: Enterprise Insurance Policy Management Service

servers:
  - url: http://localhost:8080

tags:
  - name: Policies

paths:

  /api/v1/policies:

    get:
      tags:
        - Policies
      summary: Search policies

      operationId: searchPolicies

      parameters:

        - name: page
          in: query
          schema:
            type: integer
            default: 0

        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100

        - name: sort
          in: query
          schema:
            type: string
            example: premiumAmount,desc

        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PolicyStatus'

        - name: lineOfBusiness
          in: query
          schema:
            $ref: '#/components/schemas/LineOfBusiness'

        - name: region
          in: query
          schema:
            type: string

        - name: effectiveDateFrom
          in: query
          schema:
            type: string
            format: date

        - name: effectiveDateTo
          in: query
          schema:
            type: string
            format: date

        - name: search
          in: query
          schema:
            type: string

      responses:

        '200':
          description: Policy page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPageResponse'

        default:
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/policies/{id}:

    get:

      tags:
        - Policies

      summary: Get policy by id

      operationId: getPolicyById

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:

        '200':
          description: Policy found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'

        '404':
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/policies/flag:

    patch:

      tags:
        - Policies

      summary: Flag policies for review

      operationId: flagPolicies

      requestBody:

        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkFlagRequest'

      responses:

        '204':
          description: Policies flagged

        default:
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/policies/summary:

    get:

      tags:
        - Policies

      summary: Policy summary

      operationId: getPolicySummary

      responses:

        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySummaryResponse'

        default:
          $ref: '#/components/responses/ProblemResponse'

components:

  responses:

    ProblemResponse:
      description: Error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:

    PolicyStatus:
      type: string
      enum:
        - ACTIVE
        - EXPIRED
        - PENDING
        - CANCELLED

    LineOfBusiness:
      type: string
      enum:
        - PROPERTY
        - CASUALTY
        - AH
        - MARINE

    CurrencyCode:
      type: string
      enum:
        - SGD
        - HKD
        - AUD
        - USD
        - JPY

    PolicyResponse:

      type: object

      properties:

        id:
          type: string
          format: uuid

        policyNumber:
          type: string

        policyholderName:
          type: string

        underwriter:
          type: string

        lineOfBusiness:
          $ref: '#/components/schemas/LineOfBusiness'

        status:
          $ref: '#/components/schemas/PolicyStatus'

        region:
          type: string

        currency:
          $ref: '#/components/schemas/CurrencyCode'

        premiumAmount:
          type: number
          format: double

        effectiveDate:
          type: string
          format: date

        expirationDate:
          type: string
          format: date

        flaggedForReview:
          type: boolean

    PolicyPageResponse:

      type: object

      properties:

        content:
          type: array
          items:
            $ref: '#/components/schemas/PolicyResponse'

        page:
          type: integer

        size:
          type: integer

        totalElements:
          type: integer

        totalPages:
          type: integer

    BulkFlagRequest:

      type: object

      required:
        - policyIds

      properties:

        policyIds:

          type: array

          minItems: 1

          maxItems: 1000

          items:
            type: string
            format: uuid

    PolicySummaryResponse:

      type: object

      properties:

        statusCounts:
          type: object
          additionalProperties:
            type: integer

        premiumByLineOfBusiness:
          type: object
          additionalProperties:
            type: number

        expiringSoonCount:
          type: integer

    ProblemDetails:

      type: object

      properties:

        type:
          type: string

        title:
          type: string

        status:
          type: integer

        detail:
          type: string

        instance:
          type: string

        timestamp:
          type: string
          format: date-time

        correlationId:
          type: string